name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach pid_departures.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/pid_departures/manifest.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match the manifest version $version (expected v$version)"
            exit 1
          fi

      # HACS installs the integration from this zip (zip_release in hacs.json).
      # It holds the contents of the integration folder, not the folder itself.
      - name: Build pid_departures.zip
        working-directory: custom_components/pid_departures
        run: zip -r "$GITHUB_WORKSPACE/pid_departures.zip" . -x "*__pycache__*" "*.pyc"

      - name: Upload pid_departures.zip
        run: gh release upload "$GITHUB_REF_NAME" pid_departures.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
